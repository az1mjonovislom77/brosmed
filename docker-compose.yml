services:
  main_app:
    build: .
    container_name: main_app
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pdf_service
      - redis

  pdf_service:
    build: ./pdf_service
    container_name: pdf_service
    ports:
      - "8001:8001"

  redis:
    image: redis:7-alpine
    container_name: brosmed_redis